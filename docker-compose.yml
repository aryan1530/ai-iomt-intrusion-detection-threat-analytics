services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: iomt
      POSTGRES_PASSWORD: iomt
      POSTGRES_DB: iomt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://iomt:iomt@db:5432/iomt
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  pgdata:
